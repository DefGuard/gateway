name: Make a new release
run-name: ${{ inputs.draft && format('Draft v{0}', inputs.version) || format('Rehearsal {0}', github.ref_name) }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example 2.2.0 or 2.2.0-beta1. Leave empty for a rehearsal."
        required: false
        type: string
        default: ""
      draft:
        description: "Create the draft release. Nothing becomes public until you publish the draft."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.draft }}
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      version: ${{ steps.gates.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release gates
        id: gates
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          DRAFT: ${{ inputs.draft }}
          VERSION_FILE: Cargo.toml
        run: |
          set -euo pipefail
          FILE_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$VERSION_FILE" | head -n 1)
          VERSION=${INPUT_VERSION:-$FILE_VERSION}

          # Check that the version has the form MAJOR.MINOR.PATCH with an optional -suffix.
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not MAJOR.MINOR.PATCH with an optional -suffix"
            exit 1
          fi
          # Check that the version without its -suffix matches the version in Cargo.toml.
          if [[ ${VERSION%%-*} != "$FILE_VERSION" ]]; then
            echo "::error file=$VERSION_FILE::Version $VERSION does not match version $FILE_VERSION in $VERSION_FILE"
            exit 1
          fi

          if [[ $DRAFT == true ]]; then
            # Check that a draft has the version input.
            if [[ -z $INPUT_VERSION ]]; then
              echo "::error::A draft needs the version input"
              exit 1
            fi

            # Check that the tag v$VERSION does not exist yet.
            rc=0
            git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "::error::Tag v$VERSION exists. The Publish click on the draft creates the tag, so do not push it."
              exit 1
            elif [[ $rc -ne 2 ]]; then
              echo "::error::git ls-remote failed with exit code $rc"
              exit 1
            fi

            # Check that no open release-blocker issue names this branch.
            BLOCKERS=$(gh issue list --label release-blocker --state open --limit 200 --json title,url \
              --jq '.[] | select(.title | contains("] " + env.GITHUB_REF_NAME + ":")) | .url')
            if [[ -n $BLOCKERS ]]; then
              echo "::error::Open release-blocker issues for $GITHUB_REF_NAME. A green rehearsal (draft=false) closes its own issue."
              echo "$BLOCKERS"
              exit 1
            fi

            # Check that ci.yml and current.yml passed for this commit on a push to this branch.
            CI_PROBLEMS=$(gh api --method GET "repos/$GH_REPO/actions/runs" -f head_sha="$GITHUB_SHA" \
              -f branch="$GITHUB_REF_NAME" -f event=push -F per_page=100 --jq '.workflow_runs |
                (.[] | select(.conclusion != "success" and .conclusion != "skipped") | "\(.path): \(.conclusion // .status) \(.html_url)"),
                ([".github/workflows/ci.yml", ".github/workflows/current.yml"] - map(.path) | .[] | "\(.): no run")')
            if [[ -n $CI_PROBLEMS ]]; then
              echo "::error::CI for $GITHUB_SHA on $GITHUB_REF_NAME is not green. A push that changes only *.md or LICENSE files starts no CI run."
              echo "$CI_PROBLEMS"
              exit 1
            fi

            # Check that a commit is merged into this branch or into the default branch of its repository.
            require_merged() {
              local repo=$1 sha=$2 file=$3 what=$4 default branch status
              default=$(gh api "repos/$repo" --jq .default_branch)
              for branch in "$GITHUB_REF_NAME" "$default"; do
                status=$(gh api "repos/$repo/compare/$branch...$sha" --jq .status 2> /dev/null) || continue
                if [[ $status == identical || $status == behind ]]; then
                  return 0
                fi
              done
              echo "::error file=$file::$what points to $sha, which is not merged into $GITHUB_REF_NAME or $default of $repo"
              exit 1
            }

            # Check that each submodule commit is merged in the submodule repository.
            while read -r key path; do
              url=$(git config -f .gitmodules "${key%.path}.url")
              require_merged "$GITHUB_REPOSITORY_OWNER/$(basename "$url" .git)" "$(git rev-parse "HEAD:$path")" \
                .gitmodules "Submodule $path"
            done < <(git config -f .gitmodules --get-regexp '\.path$')

            # Check that the DefGuard git dependencies in Cargo.lock use one commit per repository.
            CRATE_PINS=$(awk -F '"' '
              $1 == "name = " { name = $2 }
              $1 == "source = " && tolower($2) ~ /^git\+https:\/\/github\.com\/defguard\// {
                repo = $2; sub(/^git\+https:\/\/github\.com\//, "", repo)
                commit = repo; sub(/.*#/, "", commit)
                sub(/[?#].*/, "", repo); sub(/\.git$/, "", repo)
                pin = repo " " commit
                crates[pin] = (pin in crates ? crates[pin] "," : "") name
              }
              END { for (pin in crates) print pin, crates[pin] }' Cargo.lock)
            if [[ -n $CRATE_PINS ]]; then
              SPLIT=$(cut -d ' ' -f 1 <<< "$CRATE_PINS" | sort | uniq -d)
              if [[ -n $SPLIT ]]; then
                echo "::error file=Cargo.toml::The crates of $SPLIT come from more than one commit. Give each git dependency on it the same rev."
                echo "$CRATE_PINS"
                exit 1
              fi
              # Check that each of these commits is merged in its DefGuard repository.
              while read -r repo sha crates; do
                require_merged "$repo" "$sha" Cargo.toml "The rev of $crates"
              done <<< "$CRATE_PINS"
            fi

            # Check that the milestone of this version has no open issues or pull requests.
            export VERSION
            OPEN=$(gh api "repos/$GH_REPO/milestones?state=all&per_page=100" --paginate \
              --jq '.[] | select(.title == env.VERSION) | .open_issues')
            if [[ ${OPEN:-0} != 0 ]]; then
              echo "::error::Milestone $VERSION has $OPEN open issues or pull requests. Close them, or move them to another milestone."
              exit 1
            fi
          fi

          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-docker:
    needs:
      - precheck
    name: Build Docker image
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/build-docker.yml
    with:
      tags: |
        type=sha
      # Explicitly disable latest tag. It will be added otherwise.
      flavor: |
        latest=false

  create-sbom:
    needs:
      - precheck
      - build-docker
    uses: ./.github/workflows/sbom.yml
    with:
      version: ${{ needs.precheck.outputs.version }}

  # This job catches advisories published after the last merge.
  scan-source:
    needs:
      - precheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan code with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: 1
          TRIVY_IGNOREFILE: "./.trivyignore.yaml"
        with:
          scan-type: "fs"
          scan-ref: "."
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: "vuln"

      - name: Install cargo-deny
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-deny

      - name: Check RustSec advisories
        run: cargo deny check advisories --hide-inclusion-graph

  build-release:
    needs:
      - precheck
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.precheck.outputs.version }}
      # Two runners can run this job at the same time, so each run builds in its own directory on the FreeBSD host.
      FREEBSD_DIR: work/gateway-${{ github.run_id }}
      SQLX_OFFLINE: "1"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Start FreeBSD build
        run: |
          rsync -rlptxzH -e 'ssh -l root' --del ./ "freebsd:$FREEBSD_DIR/"
          (
            rc=0
            ssh root@freebsd "cd '$FREEBSD_DIR' && cargo build --locked --release" || rc=$?
            # The rename keeps the wait loop from reading a half-written file.
            echo "$rc" > "$RUNNER_TEMP/freebsd.rc.tmp"
            mv "$RUNNER_TEMP/freebsd.rc.tmp" "$RUNNER_TEMP/freebsd.rc"
          ) > "$RUNNER_TEMP/freebsd.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/freebsd.pid"

      - name: Build source code archive
        run: tar --exclude='.github' --exclude-vcs --exclude-vcs-ignores --xform='s|^\./|gateway-${{ env.VERSION }}/|' --xz -cf ${{ runner.temp }}/defguard-gateway-${{ env.VERSION }}.tar.xz .

      - name: Upload source code archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: ${{ runner.temp }}/defguard-gateway-${{ env.VERSION }}.tar.xz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: "aarch64-unknown-linux-gnu"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # With codegen-units = 1 the end of a build uses few cores, so one cargo run for both targets fills the idle ones.
      - name: Build Linux binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          # The target suffix keeps this sysroot out of the x86_64 build in the same cargo run.
          PKG_CONFIG_SYSROOT_DIR_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-gnu --target aarch64-unknown-linux-gnu
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            mv "target/$target/release/defguard-gateway" "defguard-gateway-${{ env.VERSION }}-$target"
            tar -zcf "defguard-gateway-${{ env.VERSION }}-$target.tar.gz" "defguard-gateway-${{ env.VERSION }}-$target"
          done

      - name: Wait for FreeBSD build
        run: |
          # kill -0 ends the wait if the background build stopped before it wrote its exit code.
          while [[ ! -f $RUNNER_TEMP/freebsd.rc ]] && kill -0 "$(cat "$RUNNER_TEMP/freebsd.pid")" 2> /dev/null; do
            sleep 10
          done
          cat "$RUNNER_TEMP/freebsd.log"
          if [[ $(cat "$RUNNER_TEMP/freebsd.rc" 2> /dev/null) != 0 ]]; then
            echo "::error::The FreeBSD build failed. Its output is above."
            exit 1
          fi
          scp "root@freebsd:$FREEBSD_DIR/target/release/defguard-gateway" defguard-gateway-${{ env.VERSION }}-x86_64-unknown-freebsd
          tar -zcf defguard-gateway-${{ env.VERSION }}-x86_64-unknown-freebsd.tar.gz \
            defguard-gateway-${{ env.VERSION }}-x86_64-unknown-freebsd

      - name: Build x86_64 DEB package
        uses: defGuard/fpm-action@ebb2575fbb892876fbdd326bb6d12524fbd7398c # main
        with:
          fpm_args:
            "defguard-gateway-${{ env.VERSION }}-x86_64-unknown-linux-gnu=/usr/bin/defguard-gateway
            linux/defguard-gateway.service=/usr/lib/systemd/system/defguard-gateway.service
            example-config.toml=/etc/defguard/gateway.toml"
          fpm_opts: "--architecture amd64
            --output-type deb
            --version ${{ env.VERSION }}
            --package defguard-gateway-${{ env.VERSION }}-x86_64-unknown-linux-gnu.deb
            --before-install linux/preinst
            --after-install linux/postinst
            --before-remove linux/prerm
            --after-remove linux/postrm"

      - name: Build aarch64 DEB package
        uses: defGuard/fpm-action@ebb2575fbb892876fbdd326bb6d12524fbd7398c # main
        with:
          fpm_args:
            "defguard-gateway-${{ env.VERSION }}-aarch64-unknown-linux-gnu=/usr/bin/defguard-gateway
            linux/defguard-gateway.service=/usr/lib/systemd/system/defguard-gateway.service
            example-config.toml=/etc/defguard/gateway.toml"
          fpm_opts: "--architecture arm64
            --output-type deb
            --version ${{ env.VERSION }}
            --package defguard-gateway-${{ env.VERSION }}-aarch64-unknown-linux-gnu.deb
            --before-install linux/preinst
            --after-install linux/postinst
            --before-remove linux/prerm
            --after-remove linux/postrm"

      - name: Build x86_64 RPM package
        uses: defGuard/fpm-action@ebb2575fbb892876fbdd326bb6d12524fbd7398c # main
        with:
          fpm_args:
            "defguard-gateway-${{ env.VERSION }}-x86_64-unknown-linux-gnu=/usr/bin/defguard-gateway
            linux/defguard-gateway.service=/usr/lib/systemd/system/defguard-gateway.service
            example-config.toml=/etc/defguard/gateway.toml"
          fpm_opts: "--architecture amd64
            --output-type rpm
            --version ${{ env.VERSION }}
            --package defguard-gateway-${{ env.VERSION }}-x86_64-unknown-linux-gnu.rpm
            --before-install linux/preinst
            --after-install linux/postinst
            --before-remove linux/prerm
            --after-remove linux/postrm"

      - name: Build aarch64 RPM package
        uses: defGuard/fpm-action@ebb2575fbb892876fbdd326bb6d12524fbd7398c # main
        with:
          fpm_args:
            "defguard-gateway-${{ env.VERSION }}-aarch64-unknown-linux-gnu=/usr/bin/defguard-gateway
            linux/defguard-gateway.service=/usr/lib/systemd/system/defguard-gateway.service
            example-config.toml=/etc/defguard/gateway.toml"
          fpm_opts: "--architecture arm64
            --output-type rpm
            --version ${{ env.VERSION }}
            --package defguard-gateway-${{ env.VERSION }}-aarch64-unknown-linux-gnu.rpm
            --before-install linux/preinst
            --after-install linux/postinst
            --before-remove linux/prerm
            --after-remove linux/postrm"

      - name: Build FreeBSD package
        uses: defGuard/fpm-action@ebb2575fbb892876fbdd326bb6d12524fbd7398c # main
        with:
          fpm_args:
            "defguard-gateway-${{ env.VERSION }}-x86_64-unknown-freebsd=/usr/local/bin/defguard-gateway
            freebsd/defguard_gateway=/usr/local/etc/rc.d/defguard_gateway
            example-config.toml=/etc/defguard/gateway.toml.sample"
          fpm_opts: "--architecture amd64
            --output-type freebsd
            --version ${{ env.VERSION }}
            --package defguard-gateway-${{ env.VERSION }}_x86_64-unknown-freebsd.pkg
            --freebsd-osversion '*'
            --depends openssl
            --after-install freebsd/post-install.sh"

      - name: Build OPNsense package
        uses: defGuard/fpm-action@ebb2575fbb892876fbdd326bb6d12524fbd7398c # main
        with:
          fpm_args:
            "defguard-gateway-${{ env.VERSION }}-x86_64-unknown-freebsd=/usr/local/bin/defguard-gateway
            freebsd/defguard_gateway=/usr/local/etc/rc.d/defguard_gateway
            example-config.toml=/etc/defguard/gateway.toml.sample
            freebsd/defguard-rc.conf=/etc/rc.conf.d/defguard_gateway
            opnsense/src/etc/=/usr/local/etc/
            opnsense/src/opnsense/=/usr/local/opnsense/"
          fpm_opts: "--architecture amd64
            --output-type freebsd
            --version ${{ env.VERSION }}
            --package defguard-gateway-${{ env.VERSION }}_x86_64-unknown-opnsense.pkg
            --freebsd-osversion '*'
            --depends openssl
            --after-install freebsd/post-install.sh"

      - name: Upload binaries and packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: |
            defguard-gateway-${{ env.VERSION }}-*.tar.gz
            defguard-gateway-${{ env.VERSION }}-*.deb
            defguard-gateway-${{ env.VERSION }}-*.rpm
            defguard-gateway-${{ env.VERSION }}_x86_64-unknown-*.pkg
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Remove the FreeBSD build directory
        if: always()
        run: ssh root@freebsd "rm -rf '$FREEBSD_DIR'" || echo "::warning::Could not remove $FREEBSD_DIR on the FreeBSD host"

  ubuntu-22-04-build:
    needs:
      - precheck
    runs-on:
      - self-hosted
      - Linux
      - ${{ matrix.architecture }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.precheck.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [ARM64, X64]
        include:
          - architecture: ARM64
            deb_arch: arm64
            rust_target: aarch64-unknown-linux-gnu
          - architecture: X64
            deb_arch: amd64
            rust_target: x86_64-unknown-linux-gnu
    container:
      image: ubuntu:22.04
      env:
        DEBIAN_FRONTEND: noninteractive
        HOME: /root
        RUSTUP_HOME: /root/.rustup
        CARGO_HOME: /root/.cargo

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates libatomic1
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install build dependencies
        run: |
          apt-get install -y \
            build-essential pkg-config cmake \
            libssl-dev libmnl-dev libnftnl-dev \
            protobuf-compiler libprotobuf-dev \
            ruby ruby-dev rubygems rpm
          gem install fpm --no-document

      - name: Build binary
        run: |
          cargo build --locked --release --target ${{ matrix.rust_target }}

      - name: Build DEB package (ubuntu-22-04-lts)
        run: |
          fpm \
            --output-type deb \
            --version "${{ env.VERSION }}" \
            --architecture ${{ matrix.deb_arch }} \
            --package defguard-gateway-${{ env.VERSION }}-${{ matrix.deb_arch }}_ubuntu-22-04-lts.deb \
            --before-install linux/preinst \
            --after-install linux/postinst \
            --before-remove linux/prerm \
            --after-remove linux/postrm \
            "target/${{ matrix.rust_target }}/release/defguard-gateway=/usr/bin/defguard-gateway" \
            "linux/defguard-gateway.service=/usr/lib/systemd/system/defguard-gateway.service" \
            "example-config.toml=/etc/defguard/gateway.toml"

      - name: Upload ubuntu-22-04-lts DEB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-22-04-${{ matrix.deb_arch }}
          path: defguard-gateway-${{ env.VERSION }}-${{ matrix.deb_arch }}_ubuntu-22-04-lts.deb
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  assemble:
    needs:
      - precheck
      - build-docker
      - build-release
      - ubuntu-22-04-build
      - create-sbom
      - scan-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    env:
      VERSION: ${{ needs.precheck.outputs.version }}
      GHCR_REPO: ghcr.io/defguard/gateway
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          # docker/build-push-action adds a .dockerbuild record to the run, so download only the release artifacts.
          pattern: "{source,binaries,sbom,ubuntu-22-04-*}"
          merge-multiple: true

      - name: Record the Docker image digest
        env:
          DIGEST: ${{ needs.build-docker.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The Docker build returned no image digest: '$DIGEST'"
            exit 1
          fi
          # Later runs of the same commit move its sha tag, so the draft names this build by digest.
          echo "$GHCR_REPO@$DIGEST" > "dist/defguard-gateway-$VERSION-docker-image.txt"

      - name: Compare build output with the expected release assets
        run: |
          set -euo pipefail
          expected=(
            "defguard-gateway-$VERSION.tar.xz"
            "defguard-gateway-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
            "defguard-gateway-$VERSION-aarch64-unknown-linux-gnu.tar.gz"
            "defguard-gateway-$VERSION-x86_64-unknown-freebsd.tar.gz"
            "defguard-gateway-$VERSION-x86_64-unknown-linux-gnu.deb"
            "defguard-gateway-$VERSION-aarch64-unknown-linux-gnu.deb"
            "defguard-gateway-$VERSION-x86_64-unknown-linux-gnu.rpm"
            "defguard-gateway-$VERSION-aarch64-unknown-linux-gnu.rpm"
            "defguard-gateway-${VERSION}_x86_64-unknown-freebsd.pkg"
            "defguard-gateway-${VERSION}_x86_64-unknown-opnsense.pkg"
            "defguard-gateway-$VERSION-amd64_ubuntu-22-04-lts.deb"
            "defguard-gateway-$VERSION-arm64_ubuntu-22-04-lts.deb"
            "defguard-gateway-$VERSION.sbom.json"
            "defguard-gateway-$VERSION-docker.sbom.json"
            "defguard-gateway-$VERSION.advisories.json"
            "defguard-gateway-$VERSION-docker.advisories.json"
            "defguard-gateway-$VERSION-docker-image.txt"
          )
          if ! diff <(printf '%s\n' "${expected[@]}" | sort) <(ls dist | sort); then
            echo "::error::The build output does not match the expected release assets"
            exit 1
          fi

      - name: Create or update the draft release
        if: inputs.draft
        run: |
          set -euo pipefail
          export TAG="v$VERSION"
          # The tags endpoint returns 404 for a draft, so find the draft in the release list.
          DRAFTS=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.draft and .tag_name == env.TAG) | .id')
          case $(wc -w <<< "$DRAFTS") in
            0)
              ARGS=(--draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes)
              if [[ $VERSION == *-* ]]; then ARGS+=(--prerelease); fi
              gh release create "$TAG" "${ARGS[@]}"
              ;;
            1)
              gh api --method PATCH "repos/$GH_REPO/releases/$DRAFTS" -f target_commitish="$GITHUB_SHA" > /dev/null
              ;;
            *)
              echo "::error::More than one draft release has the tag $TAG. Delete the stale drafts."
              exit 1
              ;;
          esac

      - name: Upload release assets
        if: inputs.draft
        run: |
          for attempt in 1 2 3; do
            gh release upload "v$VERSION" dist/* --clobber && exit 0
            echo "::warning::Upload attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Close the rehearsal issue of this branch
        if: ${{ !inputs.draft }}
        run: |
          set -euo pipefail
          ISSUES=$(gh issue list --label release-blocker --state open --limit 200 --json number,title \
            --jq '.[] | select(.title | startswith("[rehearsal] " + env.GITHUB_REF_NAME + ":")) | .number')
          for issue in $ISSUES; do
            gh issue close "$issue" --comment "The rehearsal passed: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          done

  alert:
    needs:
      - precheck
      - build-docker
      - build-release
      - ubuntu-22-04-build
      - create-sbom
      - scan-source
      - assemble
    if: failure() && !inputs.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find the authors of the commits after the last green run
        id: assignees
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_GREEN=$(gh run list --branch "$GITHUB_REF_NAME" --workflow release.yml --status success \
            --limit 1 --json headSha --jq '.[0].headSha // ""')
          # A force push can remove the last green commit, so the HEAD commit is the fallback.
          SHAS=$(git log --max-count=20 --format=%H "${LAST_GREEN:-HEAD~1}..HEAD" 2> /dev/null || git log -1 --format=%H)
          USERNAMES=$(for sha in $SHAS; do
            gh api "repos/$GH_REPO/commits/$sha" --jq '.author.login // empty' 2> /dev/null || true
          done | awk 'NF && !seen[$0]++' | head -n 5 | paste -sd, -)
          echo "usernames=$USERNAMES" >> "$GITHUB_OUTPUT"

      - name: File the alert issue
        uses: DefGuard/ci-workflows/actions/alert-issue@v1.0.0
        with:
          source: rehearsal
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          failure_summary: release rehearsal failed
          run_link: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          assignees: ${{ steps.assignees.outputs.usernames }}
        env:
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
          SPRINT_PROJECT_NUMBER: ${{ vars.SPRINT_PROJECT_NUMBER }}
